version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
    - gocritic
  settings:
    errcheck:
      exclude-functions:
        # Writes of usage and status text to stdout/stderr.
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Fprint
        # Closing read-only resources (files read, HTTP bodies, connections at exit).
        - (*os.File).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*database/sql.DB).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
  exclusions:
    rules:
      # Test cleanups and best-effort closes may ignore errors.
      - path: _test\.go
        linters: [errcheck]
      # Test helpers (fake bucket, file writer) write to in-memory buffers and test servers.
      - path: internal/testkit/
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
