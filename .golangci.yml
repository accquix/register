version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
    - gocritic
  settings:
    errcheck:
      exclude-functions:
        # Writes of usage and status text to stdout/stderr.
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Fprint
        - (*database/sql.DB).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
  exclusions:
    rules:
      # Test cleanups and best-effort closes may ignore errors.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
