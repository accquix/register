components:
  schemas:
    Address:
      additionalProperties: false
      properties:
        buildingNumber:
          type: string
        country:
          type: string
        municipality:
          type: string
        postalCode:
          type: string
        street:
          type: string
      type: object
    BatchBody:
      additionalProperties: false
      properties:
        attribution:
          items:
            type: string
          type:
            - array
            - "null"
        items:
          items:
            $ref: "#/components/schemas/BatchItem"
          type:
            - array
            - "null"
      required:
        - items
        - attribution
      type: object
    BatchInputBody:
      additionalProperties: false
      properties:
        fields:
          default: all
          description: versions returns only each section's state and version
          enum:
            - all
            - versions
          type: string
        ids:
          items:
            type: string
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
      required:
        - ids
      type: object
    BatchItem:
      additionalProperties: false
      properties:
        code:
          type: string
        id:
          type: string
        result:
          $ref: "#/components/schemas/LookupBody"
        status:
          description: HTTP status this id would get from /v1/lookup/{id}
          format: int64
          type: integer
        versions:
          description: "Per subject: section → state and version"
          items:
            additionalProperties:
              $ref: "#/components/schemas/SectionVersion"
            type: object
          type:
            - array
            - "null"
      required:
        - id
        - status
      type: object
    CapabilitiesBody:
      additionalProperties: false
      properties:
        anonymous:
          description: Anonymous access is enabled
          type: boolean
        anonymousRate:
          $ref: "#/components/schemas/RateLimit"
          description: Per anonymous client IP, per instance; only when anonymous access is on
        apiVersion:
          type: string
        demo:
          description: "true on a demo database: every answer holds fictional subjects, not register data"
          type: boolean
        fuzzy:
          $ref: "#/components/schemas/CapabilitiesBodyFuzzyStruct"
        maxInFlight:
          description: Data requests this instance runs at once; beyond that, after a short wait, 503 with reason overloaded
          format: int64
          type: integer
        mcp:
          $ref: "#/components/schemas/CapabilitiesBodyMCPStruct"
          description: The read-only MCP adapter for AI agents
        rate:
          $ref: "#/components/schemas/RateLimit"
          description: "Per API key, per instance; empty: no per-key limit (the default, set by the operator)"
        search:
          $ref: "#/components/schemas/CapabilitiesBodySearchStruct"
        taxpayerLookup:
          description: Lookup of natural persons without an IČO by DIČ
          type: boolean
        taxpayerSearch:
          $ref: "#/components/schemas/CapabilitiesBodyTaxpayerSearchStruct"
          description: Name search for taxpayers without an IČO (D56), off by default
        version:
          type: string
      required:
        - apiVersion
        - version
        - anonymous
        - taxpayerLookup
        - taxpayerSearch
        - search
        - fuzzy
        - rate
        - mcp
        - maxInFlight
        - demo
      type: object
    CapabilitiesBodyFuzzyStruct:
      additionalProperties: false
      properties:
        anonymousEvery:
          description: One fuzzy search per anonymous client IP per this interval (burst 2); only when anonymous access is on
          type: string
        concurrencyPerInstance:
          format: int64
          type: integer
        enabled:
          type: boolean
        note:
          type: string
        perKeyEvery:
          description: "One fuzzy search per API key per this interval (burst 2); absent: no per-key limit"
          type: string
        timeout:
          type: string
      required:
        - enabled
        - note
      type: object
    CapabilitiesBodyMCPStruct:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        path:
          type: string
      required:
        - enabled
      type: object
    CapabilitiesBodySearchStruct:
      additionalProperties: false
      properties:
        limitMax:
          format: int64
          type: integer
        modes:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - modes
        - limitMax
      type: object
    CapabilitiesBodyTaxpayerSearchStruct:
      additionalProperties: false
      properties:
        burst:
          format: int64
          type: integer
        enabled:
          type: boolean
        match:
          description: Every word of the name and no other, in any order; no prefixes, no fuzzy
          enum:
            - full_name
          type: string
        perSecond:
          description: Taxpayer searches per API key per second; over it a search answers without taxpayers
          format: double
          type: number
      required:
        - enabled
      type: object
    Card:
      additionalProperties: false
      properties:
        active:
          type: boolean
        address:
          $ref: "#/components/schemas/Address"
          description: The registered seat or place of business, as published in RPO
        dic:
          description: "kind taxpayer only: the taxpayer's DIČ"
          type: string
        ico:
          type: string
        kind:
          description: "taxpayer: a DIČ without an IČO (mostly natural persons, for example landlords), from the Financial Administration's DIČ list: found by an exact DIČ, or by the full name when the operator turned taxpayer search on (D56); only the name and municipality, as in the lookup, and never on an instance with anonymous access"
          enum:
            - legal_person
            - sole_trader
            - public_body
            - other
            - taxpayer
          type: string
        matchedName:
          description: The official name that matched, when it is not the display name
          type: string
        municipality:
          type: string
        name:
          description: Display name, with diacritics and legal form
          type: string
        typos:
          description: "fuzzy only: corrections needed"
          format: int64
          type: integer
      required:
        - name
        - kind
        - active
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    Identity:
      additionalProperties: false
      properties:
        active:
          type: boolean
        address:
          $ref: "#/components/schemas/Address"
        establishedOn:
          type: string
        icoChecksumValid:
          description: The IČO check digit; a warning only, real IČOs exist that fail it
          type: boolean
        kind:
          enum:
            - legal_person
            - sole_trader
            - public_body
            - other
          type: string
        legalForm:
          type: string
        legalFormCode:
          type: string
        name:
          type: string
        registrations:
          items:
            $ref: "#/components/schemas/Registration"
          type:
            - array
            - "null"
        source:
          $ref: "#/components/schemas/SourceRef"
        state:
          enum:
            - present
            - absent
            - unknown
          type: string
        terminatedOn:
          type: string
      required:
        - state
        - source
      type: object
    ListEntry:
      additionalProperties: false
      properties:
        attrs:
          additionalProperties:
            type: string
          type: object
        dataset:
          type: string
      required:
        - dataset
      type: object
    LookupBody:
      additionalProperties: false
      properties:
        attribution:
          items:
            type: string
          type:
            - array
            - "null"
        subjects:
          description: One subject; several for a VAT group (IČ DPH)
          items:
            $ref: "#/components/schemas/Subject"
          type:
            - array
            - "null"
        taxpayer:
          $ref: "#/components/schemas/Taxpayer"
          description: A natural person without an IČO, found by DIČ (authenticated callers only)
        type:
          enum:
            - ico
            - dic
            - ic_dph
          type: string
      required:
        - type
        - subjects
        - attribution
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: "Stable error code: invalid_request, invalid_identifier, unauthorized, forbidden, not_found, rate_limited, fuzzy_disabled, unavailable, internal"
          type: string
        detail:
          description: Explanation specific to this occurrence
          type: string
        errors:
          description: Validation details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        reason:
          description: "For unavailable: bootstrapping, setup, source_stale, timeout, database, overloaded"
          type: string
        status:
          description: HTTP status code
          format: int64
          type: integer
        title:
          description: Short summary of the problem type
          type: string
        type:
          description: A URI reference for the problem type
          type: string
      required:
        - title
        - status
        - code
      type: object
    RateLimit:
      additionalProperties: false
      properties:
        burst:
          format: int64
          type: integer
        perSecond:
          format: double
          type: number
      type: object
    Registration:
      additionalProperties: false
      properties:
        active:
          type: boolean
        name:
          description: The subject's name in this record
          type: string
        number:
          description: Registration number (oddiel/vložka or trade licence number)
          type: string
        office:
          description: Registration court or office
          type: string
        register:
          description: Source register, e.g. Obchodný register
          type: string
        registerCode:
          type: string
        terminatedOn:
          type: string
        validFrom:
          type: string
      required:
        - active
      type: object
    Risk:
      additionalProperties: false
      properties:
        entries:
          description: ds_dphz (grounds to cancel VAT registration), ds_dphv (removed from that list), ds_dpho (special scheme)
          items:
            $ref: "#/components/schemas/ListEntry"
          type:
            - array
            - "null"
        reliabilityIndex:
          description: "ds_iz_ran: vysoko spoľahlivý, spoľahlivý, menej spoľahlivý"
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        state:
          enum:
            - present
            - absent
            - unknown
          type: string
      required:
        - state
        - source
      type: object
    SearchBody:
      additionalProperties: false
      properties:
        attribution:
          items:
            type: string
          type:
            - array
            - "null"
        corrections:
          description: "fuzzy: corrected words"
          items:
            type: string
          type:
            - array
            - "null"
        dataAsOf:
          description: As-of date of the RPO data the search layer is built from
          type: string
        mode:
          type: string
        results:
          items:
            $ref: "#/components/schemas/Card"
          type:
            - array
            - "null"
        taxpayers:
          description: "Only when the instance searches taxpayers without an IČO by name (D56): searched; not_searched (fuzzy mode, fewer than two words, or the businesses filled the limit: only a full name is matched, after the businesses); rate_limited (the results are without taxpayers, retry later); stale (the DIČ list is not fresh, so taxpayers were not searched: their absence means nothing)"
          enum:
            - searched
            - not_searched
            - rate_limited
            - stale
          type: string
      required:
        - mode
        - results
        - attribution
      type: object
    SectionVersion:
      additionalProperties: false
      properties:
        state:
          type: string
        version:
          type: string
      required:
        - state
      type: object
    SourceInfo:
      additionalProperties: false
      properties:
        diagnostic:
          type: string
        items:
          description: "Financial Administration lists: items of the published file kept, with an identifier"
          format: int64
          type: integer
        itemsWithoutDic:
          description: "DIČ list: items left out because they have an IČO and no DIČ yet (new businesses). Normal, with no limit"
          format: int64
          type: integer
        maxAgeDays:
          format: int64
          type: integer
        publishedAsOf:
          description: Date the published data was stamped by the agency
          type: string
        skippedItems:
          description: Items of the published file left out because they carry no identifier at all. Above the list's cap (0.05 % of the DIČ list, at most 1000; 0.01 % of the others, at most 100; never less than 10) the list is blocked
          format: int64
          type: integer
        source:
          type: string
        stale:
          type: boolean
        state:
          enum:
            - empty
            - bootstrap
            - daily
            - gap_wait
            - reconcile
            - blocked
          type: string
      required:
        - source
        - state
        - stale
        - maxAgeDays
      type: object
    SourceRef:
      additionalProperties: false
      properties:
        asOf:
          description: As-of date of the dataset (the agency's date)
          type: string
        changedAt:
          description: When the register last saw this content change
          format: date-time
          type: string
        dataset:
          type: string
        stale:
          type: boolean
        version:
          description: Content hash of the section; compare to detect changes
          type: string
      required:
        - dataset
        - stale
      type: object
    SourcesBody:
      additionalProperties: false
      properties:
        attribution:
          items:
            type: string
          type:
            - array
            - "null"
        bootstrapping:
          description: true until every source is first published
          type: boolean
        demo:
          description: "true on a demo database: fictional subjects, not register data (accquix-register demo)"
          type: boolean
        licences:
          additionalProperties:
            type: string
          type: object
        setupPending:
          description: true until the operator confirms the objections of this installation; the data endpoints answer 503 reason=setup
          type: boolean
        sources:
          items:
            $ref: "#/components/schemas/SourceInfo"
          type:
            - array
            - "null"
      required:
        - sources
        - bootstrapping
        - setupPending
        - demo
        - licences
        - attribution
      type: object
    Subject:
      additionalProperties: false
      properties:
        ico:
          type: string
        identity:
          $ref: "#/components/schemas/Identity"
        risk:
          $ref: "#/components/schemas/Risk"
        tax:
          $ref: "#/components/schemas/Tax"
        vat:
          $ref: "#/components/schemas/VAT"
      required:
        - identity
        - tax
        - vat
        - risk
      type: object
    Tax:
      additionalProperties: false
      properties:
        dic:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        state:
          enum:
            - present
            - absent
            - unknown
          type: string
      required:
        - state
        - source
      type: object
    Taxpayer:
      additionalProperties: false
      properties:
        dic:
          type: string
        municipality:
          type: string
        name:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
      required:
        - dic
        - source
      type: object
    VAT:
      additionalProperties: false
      properties:
        icDph:
          type: string
        name:
          description: Name as registered for VAT
          type: string
        paragraph:
          description: §7 and §7a are registered but are not VAT payers
          enum:
            - §4
            - §4b
            - §5
            - §7
            - §7a
          type: string
        payer:
          description: true/false only from fresh data; null when unknown
          type:
            - boolean
            - "null"
        payerFrom:
          description: Always null for §7 and §7a
          type: string
        registeredOn:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        state:
          enum:
            - present
            - absent
            - unknown
          type: string
        typeChangedOn:
          type: string
      required:
        - state
        - source
        - payer
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  description: "Search and lookup of Slovak business register data (RPO and the Financial Administration lists). Search proposes; only an exact identifier resolves. Data: RPO © Ministerstvo vnútra SR, CC BY 4.0; Zdroj údajov: Finančná správa SR."
  title: Accquix Register API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/capabilities:
    get:
      operationId: capabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: What this instance offers
      tags:
        - Service
  /v1/lookup/{id}:
    get:
      description: Sections identity (RPO), tax, vat and risk (Financial Administration lists), each with state present/absent/unknown, source as-of date and a content version. 404 only when every consulted dataset is fresh.
      operationId: lookup
      parameters:
        - description: IČO (8 digits), DIČ (10 digits) or IČ DPH (SK + 10 digits)
          in: path
          name: id
          required: true
          schema:
            description: IČO (8 digits), DIČ (10 digits) or IČ DPH (SK + 10 digits)
            maxLength: 20
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Look up by IČO, DIČ or IČ DPH
      tags:
        - Lookup
  /v1/lookup:batch:
    post:
      description: fields=versions returns only the section versions, for daily change checks.
      operationId: lookupBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Look up up to 100 identifiers
      tags:
        - Lookup
  /v1/search:
    get:
      description: "One box: an identifier gives an exact match; anything else is a name search (diacritics and word order ignored, start of any word matched). mode=fuzzy corrects typos and is rate-limited. Search proposes; resolve with /v1/lookup/{id}."
      operationId: search
      parameters:
        - description: Name, IČO, DIČ or IČ DPH
          explode: false
          in: query
          name: q
          required: true
          schema:
            description: Name, IČO, DIČ or IČ DPH
            maxLength: 200
            minLength: 1
            type: string
        - description: fuzzy corrects typos; explicit only, may be disabled (see /v1/capabilities)
          explode: false
          in: query
          name: mode
          schema:
            default: default
            description: fuzzy corrects typos; explicit only, may be disabled (see /v1/capabilities)
            enum:
              - default
              - fuzzy
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 10
            format: int64
            maximum: 20
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Search by name or identifier
      tags:
        - Search
  /v1/sources:
    get:
      operationId: sources
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcesBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Service Unavailable
      summary: Data freshness per source
      tags:
        - Service
security:
  - bearer: []
servers:
  - description: Your instance (docker compose default)
    url: http://localhost:8080
tags:
  - description: Search by name or identifier. Search proposes; resolve with a lookup.
    name: Search
  - description: Subjects by IČO, DIČ or IČ DPH, with sections, states and versions.
    name: Lookup
  - description: Data freshness and what this instance offers.
    name: Service
