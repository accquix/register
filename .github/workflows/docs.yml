name: docs

# Builds and checks the documentation site (site/, Blume) on every pull request and push to main
# that touches it. Cloudflare Workers Builds deploys the site itself from the repository (path
# site, build command `npm ci && npx blume build`, deploy command `npx wrangler deploy`, served as
# static assets per site/wrangler.jsonc), so this workflow holds no deploy credentials.

on:
  pull_request:
    paths: ["site/**", "api/openapi.yaml", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["site/**", "api/openapi.yaml", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: build (fails on content errors)
        run: npx blume build
      - name: check links
        run: npx blume validate
      - name: every English page has a Slovak page
        run: diff <(cd docs && find . -name '*.mdx' -not -path './sk/*' | sort) <(cd docs/sk && find . -name '*.mdx' | sort)
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist
          retention-days: 7
