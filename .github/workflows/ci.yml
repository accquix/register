name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REGISTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/accquix-register

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "start postgres, migrate and serve (no sync: no downloads in CI)"
        working-directory: deploy/compose
        run: |
          ./make-secrets.sh > /dev/null
          docker compose up -d --build postgres migrate serve
          for _ in $(seq 1 60); do curl -fs localhost:8080/livez && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/livez)" = 200
          # no data yet: not ready, and the API refuses without a key
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/readyz)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8080/v1/search?q=x')" = 401
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
      - name: "roles: no register process is a superuser, and the API role cannot write"
        working-directory: deploy/compose
        run: |
          sql() { docker compose exec -T postgres psql -U postgres -d register -At -c "$1"; }
          test "$(sql "select count(*) from pg_roles where rolname like 'register\_%' and (rolsuper or rolcreaterole or rolcreatedb or rolbypassrls)")" = 0
          test "$(sql "select count(*) from pg_roles where rolname in ('register_migrate','register_sync','register_api')")" = 3
          as_api() { docker compose exec -T postgres sh -c 'PGPASSWORD=$(cat /run/secrets/api_password) psql -h 127.0.0.1 -U register_api -d register -At -v ON_ERROR_STOP=1 -c "$1"' sh "$1"; }
          test "$(as_api 'select count(*) from sync_source')" = 0
          ! as_api "insert into search_suppression (skey) values ('99900001')"
          ! as_api "create table t (x int)"
          ! as_api "copy (select 1) to program 'id'"
      - name: logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs
