name: Feature request
description: Propose a change or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need, and why?
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Related decisions
      description: If this touches a decision in docs/decisions.md, which one and why it should change.
